apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: repo-homelab
  namespace: argocd
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: argocd/homelab-repo
  refreshAfter: 60s
  destination:
    create: true
    overwrite: true
    name: repo-homelab
    labels:
      argocd.argoproj.io/secret-type: repository
