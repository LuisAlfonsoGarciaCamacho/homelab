apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow-argo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:LuisAlfonsoGarciaCamacho/homelab.git
      targetRevision: main
      path: airflow_argo/infra
    - repoURL: git@github.com:LuisAlfonsoGarciaCamacho/homelab.git
      targetRevision: main
      path: airflow_argo
      helm:
        valueFiles:
          - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow-argo
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
        - /spec
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .metadata.resourceVersion
        - .metadata.managedFields
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/selector
        - /spec/template
    - kind: Secret
      name: airflow-argo-fernet-key
      jqPathExpressions:
        - .data
    - kind: Secret
      name: airflow-argo-jwt-secret
      jqPathExpressions:
        - .data
    - kind: Secret
      name: airflow-argo-api-secret-key
      jqPathExpressions:
        - .data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
