apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-dags-sync
  namespace: airflow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              set -e
              cp /etc/git-secret/ssh /tmp/ssh_key && chmod 600 /tmp/ssh_key
              export GIT_SSH_COMMAND="ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no"
              echo "Cloning repo..."
              git clone -b main --depth 1 git@github.com:LuisAlfonsoGarciaCamacho/homelab.git /tmp/repo
              echo "Copying dags..."
              mkdir -p /dags
              cp -rv /tmp/repo/airflow/dags/. /dags/
              echo "Done. Contents of /dags:"
              ls -la /dags
          volumeMounts:
            - name: dags
              mountPath: /dags
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
      volumes:
        - name: dags
          persistentVolumeClaim:
            claimName: airflow-dags-rwx
        - name: git-secret
          secret:
            secretName: airflow-dags-repo-ssh
            items:
              - key: ssh
                path: ssh
            defaultMode: 0400
