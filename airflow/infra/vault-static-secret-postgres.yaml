apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: airflow-postgres
  namespace: airflow
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: airflow/postgres
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: airflow-api-server
    - kind: Deployment
      name: airflow-scheduler
    - kind: Deployment
      name: airflow-triggerer
    - kind: Deployment
      name: airflow-dag-processor
    - kind: Deployment
      name: airflow-statsd
  destination:
    create: true
    overwrite: true
    name: airflow-postgres-app
