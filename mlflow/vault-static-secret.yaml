# VaultStaticSecret: secret/mlflow/postgres -> mlflow-postgres-credentials (username, password)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mlflow-postgres
  namespace: mlflow
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: mlflow/postgres
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: mlflow
  destination:
    create: true
    overwrite: true
    name: mlflow-postgres-credentials
