apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mlflow-app
  namespace: mlflow
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: mlflow/app
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: mlflow
  destination:
    create: true
    overwrite: true
    name: mlflow-app-secrets
