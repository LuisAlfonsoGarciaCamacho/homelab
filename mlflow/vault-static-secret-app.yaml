# VaultStaticSecret: secret/mlflow/app -> K8s Secret mlflow-app-secrets (username, password)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mlflow-app
  namespace: mlflow
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: mlflow/app
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: mlflow
  destination:
    create: true
    overwrite: true
    name: mlflow-app-secrets
