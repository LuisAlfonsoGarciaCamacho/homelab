apiVersion: batch/v1
kind: Job
metadata:
  name: vault-write-mlflow-app
  namespace: mlflow
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: write-secret
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              TOKEN="${VAULT_TOKEN}"
              USER="${VAULT_APP_USERNAME:-admin}"
              PASS="${VAULT_APP_PASSWORD:?Set password in Secret vault-write-app-token key password}"
              if [ -z "$TOKEN" ]; then echo "VAULT_TOKEN empty"; exit 1; fi
              echo "Writing secret/mlflow/app (username=$USER)..."
              curl -sf -X PUT \
                -H "X-Vault-Token: $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"data\":{\"username\":\"$USER\",\"password\":\"$PASS\"}}" \
                "http://vault.vault.svc.cluster.local:8200/v1/secret/data/mlflow/app"
              echo ""
              echo "Done. VSO will sync to mlflow-app-secrets."
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-write-app-token
                  key: token
            - name: VAULT_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vault-write-app-token
                  key: username
                  optional: true
            - name: VAULT_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vault-write-app-token
                  key: password
                  optional: true
