apiVersion: kubeai.org/v1
kind: Model
metadata:
  name: qwen3-8b
  namespace: kubeai
spec:
  engine: VLLM
  features:
    - TextGeneration
  url: hf://Qwen/Qwen3-8B-AWQ
  cacheProfile: longhorn-cache
  image: vllm/vllm-openai:v0.10.2
  minReplicas: 1
  maxReplicas: 1
  resourceProfile: "nvidia-gpu-a16:1"
  args:
    - --max-model-len=16000
    - --gpu-memory-utilization=0.8
    - --max-num-seqs=16
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - --trust-remote-code
