apiVersion: batch/v1
kind: CronJob
metadata:
  name: solidtime-scheduler
  namespace: solidtime
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
          - name: storage-init
            image: busybox:1.36
            securityContext:
              runAsUser: 0
            command:
            - sh
            - -c
            - mkdir -p /var/www/html/storage/framework/cache /var/www/html/storage/framework/views /var/www/html/storage/framework/sessions /var/www/html/storage/logs /var/www/html/storage/app && chown -R 1000:1000 /var/www/html/storage && chmod -R 775 /var/www/html/storage
            volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
          containers:
          - name: scheduler
            image: solidtime/solidtime:0.11.5
            command:
            - php
            - artisan
            - schedule:run
            volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            env:
            - name: CONTAINER_MODE
              value: scheduler
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: solidtime-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solidtime-postgres-credentials
                  key: password
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: solidtime-app-secrets
                  key: APP_KEY
            - name: PASSPORT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: solidtime-app-secrets
                  key: PASSPORT_PRIVATE_KEY
            - name: PASSPORT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: solidtime-app-secrets
                  key: PASSPORT_PUBLIC_KEY
            envFrom:
            - configMapRef:
                name: solidtime-config
            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"
          volumes:
          - name: storage
            persistentVolumeClaim:
              claimName: solidtime-storage-longhorn
