apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidtime-worker
  namespace: solidtime
  labels:
    app: solidtime
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solidtime
      component: worker
  template:
    metadata:
      labels:
        app: solidtime
        component: worker
    spec:
      initContainers:
      - name: storage-init
        image: busybox:1.36
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - mkdir -p /var/www/html/storage/framework/cache /var/www/html/storage/framework/views /var/www/html/storage/framework/sessions /var/www/html/storage/logs && chown -R 33:33 /var/www/html/storage && chmod -R 775 /var/www/html/storage
        volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
      containers:
      - name: worker
        image: solidtime/solidtime:0.11.5
        env:
        - name: CONTAINER_MODE
          value: worker
        - name: WORKER_COMMAND
          value: "php /var/www/html/artisan queue:work"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: solidtime-postgres-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: solidtime-postgres-credentials
              key: password
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: solidtime-app-secrets
              key: APP_KEY
        - name: PASSPORT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: solidtime-app-secrets
              key: PASSPORT_PRIVATE_KEY
        - name: PASSPORT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: solidtime-app-secrets
              key: PASSPORT_PUBLIC_KEY
        envFrom:
        - configMapRef:
            name: solidtime-config
        volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: solidtime-storage-longhorn
