apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openclaw-env
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: openclaw/env
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: openclaw
  destination:
    create: true
    overwrite: true
    name: openclaw-env-secret
