apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: airflow-argo-app
  namespace: airflow-argo
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: airflow_argo/app
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: airflow-argo-api-server
    - kind: Deployment
      name: airflow-argo-scheduler
    - kind: Deployment
      name: airflow-argo-triggerer
    - kind: Deployment
      name: airflow-argo-dag-processor
    - kind: Deployment
      name: airflow-argo-statsd
  destination:
    create: true
    overwrite: true
    name: airflow-argo-app-secrets
