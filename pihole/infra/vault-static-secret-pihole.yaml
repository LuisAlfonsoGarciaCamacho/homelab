apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pihole-admin
  namespace: pihole
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: pihole/app
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: pihole
  destination:
    create: true
    overwrite: true
    name: pihole-admin-from-vault
