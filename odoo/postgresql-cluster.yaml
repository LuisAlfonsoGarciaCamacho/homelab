apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: odoo-postgres
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "4MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
  
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: odoo
      owner: odoo
      secret:
        name: odoo-postgres-credentials
  resources:
    requests:
      memory: "768Mi"
      cpu: "500m"
    limits:
      memory: "1.5Gi"
      cpu: "2000m"

