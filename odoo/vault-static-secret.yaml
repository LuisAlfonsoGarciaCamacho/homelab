# VaultStaticSecret: secret/odoo/postgres -> odoo-postgres-credentials (username, password, admin_passwd)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: odoo-postgres
  namespace: odoo
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: odoo/postgres
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: odoo
  destination:
    create: true
    overwrite: true
    name: odoo-postgres-credentials
