apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  odoo.conf: |
    [options]
    addons_path = /usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons
    data_dir = /var/lib/odoo
    csv_internal_sep = ,
    db_maxconn = 64
    db_host = odoo-postgres-rw.odoo.svc.cluster.local
    db_port = 5432
    db_user = odoo
    db_name = odoo
    db_template = template1
    dbfilter = .*
    debug_mode = False
    email_from = False
    limit_memory_hard = 1610612736
    limit_memory_soft = 1073741824
    limit_request = 8192
    limit_time_cpu = 600
    limit_time_real = 1200
    list_db = True
    log_db = False
    log_handler = [':INFO']
    log_level = info
    logfile = False
    longpolling_port = 8072
    max_cron_threads = 4
    smtp_password = False
    smtp_port = 25
    smtp_server = localhost
    smtp_ssl = False
    smtp_user = False
    workers = 2
    xmlrpc = True
    xmlrpc_interface = 
    xmlrpc_port = 8069
    proxy_mode = True

