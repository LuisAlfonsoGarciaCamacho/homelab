apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: jupyterhub-postgres
  namespace: jupyterhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth-kubernetes
  mount: secret
  type: kv-v2
  path: jupyterhub/postgres
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: hub
  destination:
    create: true
    overwrite: true
    name: jupyterhub-postgres-app
