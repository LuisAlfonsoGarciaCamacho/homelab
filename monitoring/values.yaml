prometheusOperator:
  enabled: true
  serviceMonitorSelectorNilUsesHelmValues: false
  podMonitorSelectorNilUsesHelmValues: false
  probeSelectorNilUsesHelmValues: false
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 15d
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: longhorn
          resources:
            requests:
              storage: 50Gi
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    additionalScrapeConfigs: []
    evaluationInterval: 30s
    scrapeInterval: 30s

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

grafana:
  enabled: true
  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - sleep 31 && [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] && grafana-cli admin reset-admin-password "$$GF_SECURITY_ADMIN_PASSWORD" 2>/dev/null || true
  ingress:
    enabled: false
  persistence:
    enabled: true
    type: pvc
    existingClaim: prometheus-stack-grafana-longhorn
  initChownData:
    enabled: false
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  adminUser: admin
  admin:
    existingSecret: grafana-vault-admin
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_SECURITY_ADMIN_USER:
      secretKeyRef:
        name: grafana-vault-admin
        key: admin-user
    GF_SECURITY_ADMIN_PASSWORD:
      secretKeyRef:
        name: grafana-vault-admin
        key: admin-password
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  defaultDashboardsEnabled: true
  grafana.ini:
    server:
      domain: grafana.rendonindustries.com
      root_url: https://grafana.rendonindustries.com
      serve_from_sub_path: false
    security:
      allow_embedding: true

nodeExporter:
  enabled: true
  affinity: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraArgs:
    - --telemetry-port=8081
  selfMonitor:
    enabled: true
    telemetryHost: "0.0.0.0"
    telemetryPort: 8081
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

kubelet:
  enabled: true
  serviceMonitor:
    enabled: true

coreDns:
  enabled: true
  serviceMonitor:
    enabled: true

kubeApiServer:
  enabled: true
  serviceMonitor:
    enabled: true

kubeControllerManager:
  enabled: true
  serviceMonitor:
    enabled: true

kubeScheduler:
  enabled: true
  serviceMonitor:
    enabled: true

kubeProxy:
  enabled: true
  serviceMonitor:
    enabled: true

kubeEtcd:
  enabled: false

prometheus-adapter:
  enabled: false

kubeletService:
  enabled: true
